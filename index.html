<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!--
      Real HTTP caching is governed by vercel.json's Cache-Control response
      headers (s-maxage/stale-while-revalidate for SSR routes, immutable for
      hashed /assets/ files) — that's the actual, working caching contract.
      A meta http-equiv Cache-Control/Pragma/Expires trio was previously set
      here too; modern browsers largely ignore it for real network caching,
      and it directly contradicted the real headers' intent, so it's removed
      rather than kept as dead, confusing weight.
    -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!--
      NOTE: title / description / canonical / og:* / twitter:* are intentionally NOT set
      here. Every route renders its own single set of these tags via react-helmet-async
      (see src/components/SEO.tsx), and helmet only manages tags it created itself — it
      will not remove or dedupe static tags left in this file. Duplicating them here would
      produce two <title>, two meta[name=description], two canonical links etc. in the
      prerendered output, which is exactly what we don't want. Keep this file to markup
      that is genuinely identical on every page and not already emitted by SEO.tsx.
    -->
    <title>SkinLabs</title>
    <meta name="author" content="SkinLabs" />

    <!-- Performance: connect early to the origins every page depends on -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Lora was requested here historically but is not applied anywhere in the
      UI (grep-confirmed: its only reference is its own unused CSS variable
      in src/index.css) — dropped to remove 4 unnecessary font-file fetches
      from this render-blocking request. Space Mono keeps both weights: 400
      and 700 are both genuinely used (e.g. DermatologistDirectory.tsx,
      MarketplaceRestrictedAccess.tsx combine font-mono with font-bold).
    -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="preconnect" href="https://gnkpzijxuciiaamakgzm.supabase.co">
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>

    <meta name="twitter:site" content="@SkinLabsZA" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1237323355260727" crossorigin="anonymous"></script>

    <!-- PWA Theme: also set per-page by SEO.tsx via Helmet; kept here as the pre-hydration fallback -->
    <meta name="theme-color" content="#000000" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
