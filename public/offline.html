<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <title>You’re offline | SkinLabs®</title>
    <style>
      :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#5b5b5b; --line:#e4e4e7; --btn-bg:#111; --btn-fg:#fff; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --fg:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --btn-bg:#f4f4f5; --btn-fg:#111; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); }
      .logo { width: 180px; height: auto; margin-bottom: 2rem; }
      .logo.dark { display: none; }
      @media (prefers-color-scheme: dark) { .logo.light { display: none; } .logo.dark { display: block; } }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: -.015em; }
      p { margin: 0 auto; max-width: 26rem; color: var(--muted); line-height: 1.55; }
      .actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
      a, button { font: inherit; font-weight: 600; font-size: .95rem; min-height: 44px; padding: .65rem 1.25rem; border-radius: 999px; cursor: pointer; text-decoration: none;
        display: inline-flex; align-items: center; transition: transform .15s ease-out, opacity .15s ease-out; }
      button { background: var(--btn-bg); color: var(--btn-fg); border: 0; }
      a { color: var(--fg); border: 1px solid var(--line); }
      button:active, a:active { transform: scale(.98); }
      :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main role="main">
      <img class="logo light" src="/logosvg.png" width="804" height="261" alt="SkinLabs®" />
      <img class="logo dark" src="/logosvgwhite.png" width="804" height="261" alt="" />
      <h1>You’re offline</h1>
      <p>Some SkinLabs® features may be unavailable, but anything you’ve downloaded or already opened is still here. We’ll reconnect as soon as you’re back online.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/podcast">Downloaded episodes</a>
      </div>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
